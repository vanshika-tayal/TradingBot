<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Binance Trading Bot</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
		<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
	</head>
	<body>
		<!-- Header -->
		<nav class="navbar navbar-dark">
			<div class="container">
				<a class="navbar-brand" href="#">Binance Trading Bot</a>
				<div id="connection-status">
					<span class="badge bg-warning">Connecting...</span>
				</div>
			</div>
		</nav>

		<!-- Main Content -->
		<main class="container py-4">
			<!-- Trading Section -->
			<div class="row g-4 mb-4">
				<!-- Account Balance -->
				<div class="col-lg-5 col-md-6">
					<div class="card h-100">
						<div class="card-header">
							<h5 class="card-title mb-0">Account Balance</h5>
						</div>
						<div class="card-body p-0">
							<div id="balance-table">
								<table class="table">
									<thead>
										<tr>
											<th>Asset</th>
											<th>Free</th>
											<th>Locked</th>
										</tr>
									</thead>
									<tbody id="balance-body"></tbody>
								</table>
							</div>
						</div>
					</div>
				</div>

				<!-- Place Order -->
				<div class="col-lg-7 col-md-6">
					<div class="card h-100">
						<div class="card-header">
							<h5 class="card-title mb-0">Place Order</h5>
						</div>
						<div class="card-body">
							<form id="order-form" class="row g-3">
								<div class="col-12">
									<label for="symbol" class="form-label">Trading Pair</label>
									<input type="text" class="form-control" id="symbol" placeholder="Enter trading pair (e.g., BTCUSDT)" required autocomplete="off" pattern="[A-Za-z0-9]+" title="Please enter a valid trading pair (e.g., BTCUSDT)" />
								</div>
								<div class="col-md-6">
									<label for="orderType" class="form-label">Order Type</label>
									<select class="form-select" id="orderType" required>
										<option value="MARKET">Market</option>
										<option value="LIMIT">Limit</option>
										<option value="STOP_LIMIT">Stop-Limit</option>
									</select>
								</div>
								<div class="col-md-6">
									<label for="side" class="form-label">Side</label>
									<select class="form-select" id="side" required>
										<option value="BUY">Buy</option>
										<option value="SELL">Sell</option>
									</select>
								</div>
								<div class="col-12">
									<label for="quantity" class="form-label">Quantity</label>
									<input type="number" class="form-control" id="quantity" step="0.00000001" min="0" placeholder="Enter quantity to trade" required />
								</div>
								<div class="col-12 limit-field" style="display: none">
									<label for="price" class="form-label">Limit Price</label>
									<input type="number" class="form-control" id="price" step="0.00000001" min="0" placeholder="Enter limit price" />
								</div>
								<div class="col-12 stop-limit-field" style="display: none">
									<label for="stopPrice" class="form-label">Stop Price</label>
									<input type="number" class="form-control" id="stopPrice" step="0.00000001" min="0" placeholder="Enter stop price" />
								</div>
								<div class="col-12">
									<button type="submit" class="btn btn-success w-100">Place Order</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>

			<!-- Orders Section -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header d-flex justify-content-between align-items-center">
							<h5 class="card-title mb-0">Orders</h5>
							<div class="btn-group" role="group">
								<button type="button" class="btn btn-outline-primary active" id="openOrdersTab">Open Orders</button>
								<button type="button" class="btn btn-outline-primary" id="recentTradesTab">Recent Trades</button>
							</div>
						</div>
						<div class="card-body p-0">
							<!-- Open Orders Table -->
							<div id="openOrdersTable" class="table-responsive">
								<table class="table">
									<thead>
										<tr>
											<th>Time</th>
											<th>Symbol</th>
											<th>Type</th>
											<th>Side</th>
											<th>Price</th>
											<th>Amount</th>
											<th>Filled</th>
											<th>Status</th>
											<th>Action</th>
										</tr>
									</thead>
									<tbody id="orders-body"></tbody>
								</table>
							</div>

							<!-- Recent Trades Table -->
							<div id="recentTradesTable" class="table-responsive" style="display: none">
								<table class="table">
									<thead>
										<tr>
											<th>Time</th>
											<th>Symbol</th>
											<th>Side</th>
											<th>Price</th>
											<th>Amount</th>
											<th>Total</th>
											<th>Fee</th>
										</tr>
									</thead>
									<tbody id="trades-body"></tbody>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>

		<!-- Toast Notifications -->
		<div class="toast-container position-fixed top-0 end-0 p-3">
			<div id="notification-toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
				<div class="toast-header">
					<strong class="me-auto" id="toast-title">Notification</strong>
					<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
				</div>
				<div class="toast-body" id="toast-message"></div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
		<script src="{{ url_for('static', filename='js/main.js') }}"></script>
	</body>
</html>
